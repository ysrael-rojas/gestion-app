name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# Un run por PR: si se pushea de nuevo, se cancela el anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de relleno: el build solo compila, no se conecta a Supabase.
      # Evita depender de secretos para un check que es de código.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  migraciones:
    name: migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo lectura: compara supabase_migrations.schema_migrations con
      # supabase/migrations/ y falla si el repo y la base no coinciden.
      - name: Comparar el repo con la base de dev
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: npm run db:export -- --check --url "$SUPABASE_DB_URL_DEV"
