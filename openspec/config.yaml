# OpenSpec / SDD configuration for gestion-app
# Generated by SDD init executor (Gentle AI).
# This is the authoritative OpenSpec artifact store configuration.
# Legacy specs in specs/ are read-only and must not be modified.

project:
  name: gestion-app
  display_name: gestion-app
  working_dir: "C:/Users/Lenovo/Desktop/devtalles/OpenCode/gestion-app"
  default_locale: es
  language_policy:
    user_communication: spanish
    user_facing_ui_text: spanish
    code_variables_functions_hooks: english_camelCase
    api_and_schema_names: english_snake_case_or_camelCase
    commit_messages: spanish

stack:
  framework:
    name: nextjs
    version: "16.3.6"
    router: app
    has_src_dir: false
    app_dir: app
    generated_types:
      page_props: PageProps
      layout_props: LayoutProps
    notes:
      - params and searchParams are Promises; always await them.
      - proxy.ts replaces middleware.ts.
      - Do not edit the AGENTS.md block between <!-- BEGIN/END:nextjs-agent-rules -->.
  react:
    version: "19.2.8"
  styling:
    engine: tailwindcss
    version: 4
    config_mode: css-based
    globals_file: app/globals.css
    tailwind_config_file: null
  ui_library:
    name: shadcn/ui
    version: 4.x
    initialized: false
    init_command: "npx shadcn@latest init"
    add_command: "npx shadcn@latest add"
    ask_before_adding_component: true
    import_path: "@/components/ui/{component}"
    icons: lucide-react
  database:
    provider: supabase
    engine: postgres
    auth: true
    project_ref: hurattoyvarlfdydvugd
    url: "https://hurattoyvarlfdydvugd.supabase.co"
  state_and_validation:
    forms: react-hook-form
    schemas: zod
  table_library: "@tanstack/react-table"
  alias:
    name: "@/*"
    root: repo_root
    examples:
      - "@/app/..."
      - "@/components/..."
      - "@/lib/..."

sdd:
  artifact_store: openspec
  strict_tdd: true
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  execution_mode: interactive
  consent_gates:
    human_consent_required:
      - destructive_database_changes
      - publishing_releases
      - security_sensitive_changes
      - ambiguous_scope
      - size_exception
    commit_requires_explicit_user_request: true
  phase_rules:
    - design_before_code: true
    - test_before_implementation: true
    - no_spec_no_code: true
    - spec_approval_before_impl: true
    - legacy_specs_readonly: true
    - legacy_specs_dir: specs
    - openspec_artifact_dir: openspec
    - never_launch_subagents_from_executor: true
    - no_source_code_changes_without_spec: true
    - destructive_db_changes_load_skill: supabase-postgres-best-practices
    - supabase_ddl_tool: apply_migration
    - supabase_read_tool: execute_sql
    - migration_name_case: snake_case
  phases:
    - id: init
      name: SDD Init
      goal: Bootstrap the OpenSpec artifact store and project context.
      gates: []
    - id: explore
      name: Explore
      goal: Map the existing code, schemas, and conventions relevant to the change before any proposal.
      gates: []
    - id: proposal
      name: Proposal
      goal: Capture business intent, scope, non-goals, edge cases, and tradeoffs in proposal.md.
      gates:
        - human_review_for_scope_risk
    - id: spec
      name: Spec
      goal: Author delta specs under openspec/specs/ with requirements and scenarios (Given/When/Then).
      gates:
        - human_review_for_scope_risk
    - id: design
      name: Design
      goal: Capture technical design, file paths, DB migrations, contracts, and TDD plan in design.md.
      gates:
        - approved_spec_exists
    - id: tasks
      name: Tasks
      goal: Break design + spec into ordered implementation tasks with review workload forecast.
      gates:
        - approved_design_exists
    - id: apply
      name: Apply
      goal: Implement tasks under strict TDD with evidence capture.
      gates:
        - approved_tasks_exist
        - approved_design_exists
        - approved_spec_exists
    - id: verify
      name: Verify
      goal: Validate implementation against spec and tests; collect evidence.
      gates:
        - all_tests_pass
        - build_succeeds
        - lint_clean
    - id: archive
      name: Archive
      goal: Compose applicable delta specs into openspec/specs/ and close the change.
      gates:
        - user_explicit_commit_request
        - review_budget_check

testing:
  validation_sequence:
    - npm run lint
    - npm test
    - npm run build

  unit_and_components:
    runner: vitest
    version: "5.x"
    command: npm test
    watch_command: npm run test:watch
    unit_command: npm run test:unit
    component_command: npm run test:components
    coverage_command: npm run test:coverage
    config_file: vitest.config.ts
    setup_file: vitest.setup.ts
    environment: jsdom
    globals: true
    include:
      - "tests/unit/**/*.test.ts"
      - "tests/components/**/*.test.tsx"
    exclude:
      - "node_modules/**"
      - ".next/**"
      - "tests/e2e/**"
    coverage:
      provider: v8
      reporters:
        - text
        - html
        - json-summary
      include:
        - "lib/pagos/**/*.ts"
        - "lib/comprobantes/**/*.ts"
        - "lib/schemas/**/*.ts"
        - "lib/ventas/**/*.ts"
        - "lib/clientes/**/*.ts"
      exclude:
        - "**/*.d.ts"
        - "**/*.test.ts"
        - "**/*.test.tsx"
      thresholds: null
      is_informative_only: true

  e2e:
    runner: playwright
    version: "1.63.x"
    command: npm run test:e2e
    config_file: playwright.config.ts
    test_dir: tests/e2e
    browser: chromium
    base_url: "http://localhost:3000"
    parallel: false
    workers: 1
    retries:
      ci: 2
      local: 0
    dev_server:
      command: npm run dev
      url: "http://localhost:3000"
      reuse_existing_server: true
      timeout_ms: 120000
    prerequisites:
      - playwright_chromium_installed
      - dev_server_reachable
      - valid_supabase_credentials_in_env
      - database_seeded_per_e2e_spec

  lint:
    runner: eslint
    command: npm run lint
    config_file: eslint.config.mjs
    extends: eslint-config-next

  typecheck:
    runner: next
    command: npm run build
    note: TypeScript typecheck is performed as part of the production build.

paths:
  app: app
  components: components
  lib: lib
  tests: tests
  specs_legacy: specs
  openspec: openspec
  supabase_types: lib/supabase/types.ts

supabase:
  project_ref: hurattoyvarlfdydvugd
  url: "https://hurattoyvarlfdydvugd.supabase.co"
  mcp: supabase
  ddl_via: apply_migration
  read_queries_via: execute_sql
  migration_naming: snake_case
  env_password_key: SUPABASE_DB_PASSWORD
  gen_types_command: "npm run gen:types"
  gen_types_warning: "Script truncates lib/supabase/types.ts before command success; restore via git if it fails."

conventions:
  imports:
    ui_components: "@/components/ui/{name}"
    icons: lucide-react
  code_style:
    no_hardcoded_colors: true
    use_shadcn_components: true
    do_not_create_components_from_scratch: true
  notes:
    - shadcn/ui is not initialized yet; run npx shadcn@latest init before adding components.
    - Legacy specs in specs/ are read-only; OpenSpec uses openspec/.
